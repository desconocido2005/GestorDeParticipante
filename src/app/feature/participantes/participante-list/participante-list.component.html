<app-participante-form (saved)="getAll()" (updated)="getAll()">
</app-participante-form>

<div class="mt-8 max-w-4xl mx-auto">
    <h2 class="text-2xl font-bold mb-4 text-gray-800 text-center">Lista de Participantes</h2>

    <div *ngIf="participantes.length === 0" class="text-center text-gray-500">
        No hay participantes registrados.
    </div>

    <div *ngFor="let p of participantes" class="bg-white shadow-md rounded-lg p-4 mb-4">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-lg font-semibold text-blue-800">{{ p.nombre }}</p>
                <p class="text-sm text-gray-600">Correo: {{ p.correo }}</p>
                <p class="text-sm text-gray-600">Equipo: {{ p.equipo }}</p>
                <p class="text-sm text-gray-600">Especialidad: {{ p.especialidad }}</p>
                <p class="text-sm text-gray-600">Nivel: {{ p.nivel }}</p>
            </div>
            <div class="flex gap-2">
                <button (click)="editParticipante(p)"
                    class="bg-yellow-500 text-white px-3 py-2 rounded-lg hover:bg-yellow-600 transition">
                    Editar
                </button>
                <button (click)="deleteParticipante(p.id!)"
                    class="bg-red-600 text-white px-3 py-2 rounded-lg hover:bg-red-700 transition">
                    Eliminar
                </button>
            </div>
        </div>
    </div>
</div>
